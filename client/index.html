<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Reservations</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav><span class="brand">Book Table</span></nav>

  <h2 id="formTitle">Welcome back</h2>
  <p class="subtitle" id="formSubtitle">Log in to manage your reservations.</p>

  <div id="registerFields" style="display:none;">
    <label for="name">Name</label>
    <input id="name" placeholder="Your full name" />
  </div>
  <label for="email">Email</label>
  <input id="email" placeholder="you@example.com" />
  <label for="password">Password</label>
  <input id="password" type="password" placeholder="••••••••" />

  <button id="submitBtn" style="width:100%;">Log in</button>
  <p class="error" id="errorMsg"></p>
  <p class="toggle" id="toggleMode">Need an account? Register</p>

  <script>
    const API = '';
    let mode = 'login';

    document.getElementById('toggleMode').onclick = () => {
      mode = mode === 'login' ? 'register' : 'login';
      document.getElementById('formTitle').textContent = mode === 'login' ? 'Welcome back' : 'Create your account';
      document.getElementById('formSubtitle').textContent = mode === 'login' ? 'Log in to manage your reservations.' : 'Book a table in under a minute.';
      document.getElementById('submitBtn').textContent = mode === 'login' ? 'Log in' : 'Register';
      document.getElementById('registerFields').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('toggleMode').textContent = mode === 'login' ? 'Need an account? Register' : 'Already have an account? Log in';
      document.getElementById('errorMsg').textContent = '';
    };

    document.getElementById('submitBtn').onclick = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      try {
        if (mode === 'register') {
          const name = document.getElementById('name').value;
          const res = await fetch(`${API}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });
          const data = await res.json();
          if (!res.ok) { errorMsg.textContent = data.error; return; }
          alert('Account created. Please log in.');
          document.getElementById('toggleMode').click();
        } else {
          const res = await fetch(`${API}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!res.ok) { errorMsg.textContent = data.error; return; }
          localStorage.setItem('token', data.token);
          localStorage.setItem('userName', data.user.name);
          window.location.href = 'tables.html';
        }
      } catch (err) {
        errorMsg.textContent = 'Something went wrong. Try again.';
      }
    };
  </script>
</body>
</html>
