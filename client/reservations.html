<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reservations</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body>
  <nav>
    <span class="brand">Table Book</span>
    <a href="tables.html">Book</a>
    <a href="reservations.html" class="active">My reservations</a>
    <a href="#" id="logoutLink">Log out</a>
  </nav>

  <h2>My reservations</h2>
  <p class="subtitle">Everything you've booked, past and upcoming.</p>

  <div id="resList"></div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    document.getElementById('logoutLink').onclick = () => {
      localStorage.clear();
      window.location.href = 'index.html';
    };

    async function loadReservations() {
      const res = await fetch('/reservations', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      const listEl = document.getElementById('resList');
      listEl.innerHTML = '';
      if (data.length === 0) {
        listEl.innerHTML = '<p class="empty">No reservations yet — go book a table.</p>';
        return;
      }
      data.forEach(r => {
        const card = document.createElement('div');
        card.className = `card ${r.status === 'cancelled' ? 'cancelled' : ''}`;
        const dateStr = r.reservation_date.split('T')[0];
        card.innerHTML = `
          <div>
            <span class="badge">Table ${r.table_number}</span>
            <span class="meta">${dateStr} · ${r.reservation_time.slice(0,5)} · ${r.party_size} guests</span>
            <span class="status-tag ${r.status}" style="margin-top:8px; display:inline-block;">${r.status}</span>
          </div>
        `;
        if (r.status === 'confirmed') {
  const btn = document.createElement('button');
  btn.className = 'ghost';
  btn.textContent = 'Cancel';
  btn.onclick = () => cancelReservation(r.id);
  card.appendChild(btn);
} else if (r.status === 'cancelled') {
  const delBtn = document.createElement('button');
  delBtn.className = 'ghost';
  delBtn.setAttribute('aria-label', 'Delete reservation');
  delBtn.innerHTML = '<i class="bi bi-trash"></i>';
  delBtn.onclick = () => deleteReservation(r.id);
  card.appendChild(delBtn);
}
        listEl.appendChild(card);
      });
    }

    async function cancelReservation(id) {
      await fetch(`/reservations/${id}/cancel`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      loadReservations();
    }
    async function deleteReservation(id) {
  if (!confirm('Permanently delete this reservation?')) return;
  await fetch(`/reservations/${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${token}` }
  });
  loadReservations();
}

    loadReservations();
  </script>
</body>
</html>
