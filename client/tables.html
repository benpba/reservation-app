<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <span class="brand">Table Book</span>
    <a href="tables.html" class="active">Book</a>
    <a href="reservations.html">My reservations</a>
    <a href="#" id="logoutLink">Log out</a>
  </nav>

  <h2>Welcome, <span id="userName"></span></h2>
  <p class="subtitle">Pick a date and time to see what's open.</p>

  <div class="filters">
    <div>
      <label for="date">Date</label>
      <input type="date" id="date" />
    </div>
    <div>
      <label for="time">Time</label>
      <select id="time"></select>
    </div>
  </div>

  <div id="tableList"></div>
  <p class="error" id="statusMsg"></p>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';
    document.getElementById('userName').textContent = localStorage.getItem('userName') || '';

    document.getElementById('logoutLink').onclick = () => {
      localStorage.clear();
      window.location.href = 'index.html';
    };

    // Populate hourly time slots from 12:00 to 22:00
    const timeSelect = document.getElementById('time');
    for (let h = 12; h <= 22; h++) {
      const value = `${String(h).padStart(2, '0')}:00:00`;
      const label = `${String(h).padStart(2, '0')}:00`;
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      if (h === 18) opt.selected = true;
      timeSelect.appendChild(opt);
    }

    async function loadTables() {
      const res = await fetch('/tables');
      const tables = await res.json();
      const listEl = document.getElementById('tableList');
      listEl.innerHTML = '';
      tables.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <span class="badge">Table ${t.table_number}</span>
            <span class="meta">${t.seats} seats</span>
          </div>
        `;
        const btn = document.createElement('button');
        btn.textContent = 'Book';
        btn.onclick = () => bookTable(t.id, t.seats);
        card.appendChild(btn);
        listEl.appendChild(card);
      });
    }

    async function bookTable(table_id, seats) {
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.style.color = 'var(--danger)';
      if (!date) { statusMsg.textContent = 'Pick a date first.'; return; }

      const party_size = prompt(`Party size (max ${seats}):`, '2');
      if (!party_size) return;

      const res = await fetch('/reservations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ table_id, reservation_date: date, reservation_time: time, party_size: Number(party_size) })
      });
      const data = await res.json();
      if (!res.ok) { statusMsg.textContent = data.error; return; }
      statusMsg.style.color = 'var(--gold)';
      statusMsg.textContent = 'Booked. Check My Reservations.';
    }

    loadTables();
  </script>
</body>
</html>
