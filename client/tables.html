<!DOCTYPE html>
<html>
<head>
  <title>Book a Table</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    .table-card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; }
    .table-card.booked { background: #fee; }
    .table-card.available { background: #efe; }
    button { padding: 6px 12px; }
    nav a { margin-right: 16px; }
    input, select { padding: 6px; margin: 4px 0; }
  </style>
</head>
<body>
  <nav>
    <a href="tables.html">Book a Table</a>
    <a href="reservations.html">My Reservations</a>
    <a href="#" id="logoutLink">Logout</a>
  </nav>
  <h2>Welcome, <span id="userName"></span></h2>

  <label>Date: <input type="date" id="date" /></label>
  <label>Time:
    <select id="time">
      <option value="17:00:00">17:00</option>
      <option value="18:00:00">18:00</option>
      <option value="19:00:00">19:00</option>
      <option value="20:00:00">20:00</option>
      <option value="21:00:00">21:00</option>
    </select>
  </label>

  <div id="tableList"></div>
  <p id="statusMsg"></p>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';
    document.getElementById('userName').textContent = localStorage.getItem('userName') || '';

    document.getElementById('logoutLink').onclick = () => {
      localStorage.clear();
      window.location.href = 'index.html';
    };

    async function loadTables() {
      const res = await fetch('/tables');
      const tables = await res.json();
      const listEl = document.getElementById('tableList');
      listEl.innerHTML = '';
      tables.forEach(t => {
        const card = document.createElement('div');
        card.className = 'table-card available';
        card.innerHTML = `<span>Table ${t.table_number} — ${t.seats} seats</span>`;
        const btn = document.createElement('button');
        btn.textContent = 'Book';
        btn.onclick = () => bookTable(t.id, t.seats);
        card.appendChild(btn);
        listEl.appendChild(card);
      });
    }

    async function bookTable(table_id, seats) {
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const statusMsg = document.getElementById('statusMsg');
      if (!date) { statusMsg.textContent = 'Pick a date first.'; return; }

      const party_size = prompt(`Party size (max ${seats}):`, '2');
      if (!party_size) return;

      const res = await fetch('/reservations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ table_id, reservation_date: date, reservation_time: time, party_size: Number(party_size) })
      });
      const data = await res.json();
      if (!res.ok) { statusMsg.textContent = data.error; return; }
      statusMsg.textContent = 'Booked! Check My Reservations.';
    }

    loadTables();
  </script>
</body>
</html>
